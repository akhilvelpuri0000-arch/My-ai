<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My AI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{height:100vh;display:flex;background:#fff;overflow:hidden}
.sidebar{width:260px;background:#f7f7f8;border-right:1px solid #ddd;padding:15px}
.logo{font-size:22px;font-weight:bold;margin-bottom:20px}
.new-chat{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;background:#fff;cursor:pointer;font-size:15px}
.main{flex:1;display:flex;flex-direction:column;height:100vh}
.header{height:60px;border-bottom:1px solid #ddd;display:flex;align-items:center;padding:0 20px;font-weight:bold}
.messages{flex:1;overflow-y:auto;padding:25px}
.welcome{text-align:center;margin-top:15vh}
.welcome h1{font-size:30px;margin-bottom:10px}
.welcome p{color:#666}
.message{max-width:800px;margin:15px auto;padding:14px 18px;border-radius:12px;line-height:1.5;white-space:pre-wrap}
.user{background:#f0f0f0}
.ai{background:#fff}
.input-area{padding:15px;border-top:1px solid #ddd}
.input-box{max-width:800px;margin:auto;display:flex;border:1px solid #ccc;border-radius:12px;padding:8px;background:#fff}
.input-box input{flex:1;border:none;outline:none;padding:10px;font-size:16px}
.send{width:45px;border:none;border-radius:8px;background:#111;color:#fff;cursor:pointer;font-size:18px}
@media(max-width:700px){.sidebar{display:none}.messages{padding:15px}.welcome h1{font-size:25px}}
</style>
</head>
<body>
<div class="sidebar">
  <div class="logo">🤖 My AI</div>
  <button class="new-chat" onclick="newChat()">＋ New Chat</button>
</div>
<div class="main">
  <div class="header">My AI</div>
  <div class="messages" id="messages">
    <div class="welcome" id="welcome">
      <h1>How can I help you?</h1>
      <p>Ask me anything.</p>
    </div>
  </div>
  <div class="input-area">
    <div class="input-box">
      <input id="userInput" type="text" placeholder="Message My AI..." onkeydown="handleEnter(event)">
      <button class="send" onclick="sendMessage()">➤</button>
    </div>
  </div>
</div>
<script>
function handleEnter(e){if(e.key==="Enter")sendMessage()}
function sendMessage(){
  const input=document.getElementById("userInput");
  const text=input.value.trim();
  if(!text)return;
  const messages=document.getElementById("messages");
  const welcome=document.getElementById("welcome");
  if(welcome)welcome.remove();

  const user=document.createElement("div");
  user.className="message user";
  user.innerText=text;
  messages.appendChild(user);
  input.value="";

  setTimeout(()=>{
    const ai=document.createElement("div");
    ai.className="message ai";
    ai.innerText="Hello! 👋 I am My AI.\n\nThe chat interface is working. The real AI model will be connected in the next step.";
    messages.appendChild(ai);
    messages.scrollTop=messages.scrollHeight;
  },500);
  messages.scrollTop=messages.scrollHeight;
}
function newChat(){
  document.getElementById("messages").innerHTML=
  '<div class="welcome" id="welcome"><h1>How can I help you?</h1><p>Ask me anything.</p></div>';
}
</script>
</body>
</html>
