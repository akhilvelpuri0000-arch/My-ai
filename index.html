<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f7f7f8;height:100vh;display:flex;color:#222}
.sidebar{width:230px;background:#202123;color:white;padding:15px}
.logo{font-size:22px;font-weight:bold;margin-bottom:20px}
.new-chat{width:100%;padding:12px;background:transparent;border:1px solid #555;border-radius:8px;color:white;font-size:15px}
.main{flex:1;display:flex;flex-direction:column;height:100vh}
.header{height:60px;background:white;border-bottom:1px solid #ddd;display:flex;align-items:center;padding:0 20px;font-size:19px;font-weight:bold}
.chat{flex:1;overflow-y:auto;padding:25px}
.welcome{text-align:center;margin-top:25vh}
.welcome h2{margin-bottom:8px}.welcome p{color:#777}
.message{max-width:800px;margin:12px auto;padding:14px 16px;border-radius:10px;line-height:1.5;white-space:pre-wrap}
.user{background:#e8e8e8}.ai{background:white;border:1px solid #ddd}
.input-area{padding:15px;background:white;border-top:1px solid #ddd}
.input-box{max-width:800px;margin:auto;display:flex;gap:8px}
#messageInput{flex:1;padding:14px;border:1px solid #bbb;border-radius:10px;outline:none;font-size:16px}
#sendButton{padding:0 20px;border:none;border-radius:10px;background:#222;color:white;font-size:16px}
#sendButton:disabled{opacity:.5}
@media(max-width:600px){.sidebar{display:none}.chat{padding:12px}.input-area{padding:10px}}
</style>
</head>
<body>
<aside class="sidebar">
<div class="logo">🤖 My AI</div>
<button class="new-chat" onclick="newChat()">＋ New Chat</button>
</aside>
<main class="main">
<header class="header">My AI</header>
<section class="chat" id="chat">
<div class="welcome" id="welcome"><h2>How can I help you?</h2><p>Ask me anything.</p></div>
</section>
<div class="input-area"><div class="input-box">
<input type="text" id="messageInput" placeholder="Message My AI..." autocomplete="off">
<button id="sendButton" onclick="sendMessage()">Send</button>
</div></div>
</main>
<script>
const input=document.getElementById("messageInput");
const sendButton=document.getElementById("sendButton");
const chat=document.getElementById("chat");
const welcome=document.getElementById("welcome");

input.addEventListener("keydown",e=>{if(e.key==="Enter")sendMessage()});

async function sendMessage(){
const message=input.value.trim();
if(!message)return;
welcome.style.display="none";
addMessage(message,"user");
input.value="";
sendButton.disabled=true;
sendButton.textContent="Thinking...";
const thinking=addMessage("Thinking...","ai");
try{
const response=await fetch("/api/chat",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({message})
});
const data=await response.json();
if(!response.ok)throw new Error(data.error||"Something went wrong");
thinking.textContent=data.reply||"No response received.";
}catch(error){
thinking.textContent="Sorry, something went wrong: "+error.message;
}
sendButton.disabled=false;
sendButton.textContent="Send";
chat.scrollTop=chat.scrollHeight;
}

function addMessage(text,type){
const div=document.createElement("div");
div.className="message "+type;
div.textContent=text;
chat.appendChild(div);
chat.scrollTop=chat.scrollHeight;
return div;
}

function newChat(){
chat.innerHTML='<div class="welcome" id="welcome"><h2>How can I help you?</h2><p>Ask me anything.</p></div>';
input.value="";
input.focus();
}
</script>
</body>
</html>
